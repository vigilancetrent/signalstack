<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="signalstack — live cyberpunk dashboard for the quantflow ecosystem">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="100%" stop-color="#0a0e1f"/>
    </linearGradient>
    <linearGradient id="namegrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f0abfc"/>
    </linearGradient>
    <linearGradient id="line-cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="fill-cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1f2937" stroke-width="0.5" opacity="0.55"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <ellipse cx="970" cy="160" rx="380" ry="220" fill="url(#glow)"/>

  <!-- Animated scanline -->
  <rect x="0" y="0" width="1280" height="2" fill="#22d3ee" opacity="0.18">
    <animate attributeName="y" values="0;320;0" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- LEFT -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, system-ui, sans-serif">
    <g transform="translate(60, 80)">
      <rect width="64" height="64" rx="12" fill="none" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="2"/>
      <text x="32" y="44" font-size="28" font-weight="800" fill="url(#namegrad)" text-anchor="middle" letter-spacing="-0.5">ss</text>
      <path d="M 0 8 L 0 0 L 8 0" fill="none" stroke="#a78bfa" stroke-width="2"/>
      <path d="M 56 0 L 64 0 L 64 8" fill="none" stroke="#a78bfa" stroke-width="2"/>
      <path d="M 64 56 L 64 64 L 56 64" fill="none" stroke="#a78bfa" stroke-width="2"/>
      <path d="M 8 64 L 0 64 L 0 56" fill="none" stroke="#a78bfa" stroke-width="2"/>
    </g>

    <g transform="translate(148, 100)" font-family="ui-monospace, Consolas, monospace">
      <rect width="200" height="22" rx="11" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.5"/>
      <circle cx="14" cy="11" r="3" fill="#22d3ee">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="26" y="15" font-size="10" fill="#22d3ee" letter-spacing="1.5">SIGNALSTACK // LIVE</text>
    </g>

    <text x="60" y="180" font-size="68" font-weight="800" fill="url(#namegrad)" letter-spacing="-2.5" filter="url(#neon)">
      signalstack
    </text>

    <text x="60" y="216" font-size="18" font-weight="500" fill="#cbd5e1" letter-spacing="0.3">
      Live cyberpunk dashboard for the quantflow ecosystem.
    </text>

    <g transform="translate(60, 240)" font-family="ui-monospace, Consolas, monospace">
      <g><rect width="92" height="28" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.55"/><text x="46" y="19" font-size="11" font-weight="700" fill="#22d3ee" text-anchor="middle">NEXT.JS 15</text></g>
      <g transform="translate(104, 0)"><rect width="100" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.55"/><text x="50" y="19" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">TYPESCRIPT</text></g>
      <g transform="translate(216, 0)"><rect width="56" height="28" rx="14" fill="#0f172a" stroke="#a78bfa" stroke-opacity="0.55"/><text x="28" y="19" font-size="11" font-weight="700" fill="#a78bfa" text-anchor="middle">SSE</text></g>
      <g transform="translate(284, 0)"><rect width="76" height="28" rx="14" fill="#0f172a" stroke="#f0abfc" stroke-opacity="0.55"/><text x="38" y="19" font-size="11" font-weight="700" fill="#f0abfc" text-anchor="middle">VERCEL</text></g>
    </g>

    <text x="60" y="304" font-family="ui-monospace, Consolas, monospace" font-size="10" fill="#475569" letter-spacing="2.4">
      MIT  ·  FLUID COMPUTE  ·  LIGHTWEIGHT-CHARTS  ·  TAILWIND
    </text>
  </g>

  <!-- RIGHT: mini-dashboard preview -->
  <g transform="translate(700, 50)">
    <!-- Outer panel -->
    <rect x="0" y="0" width="540" height="240" rx="10" fill="#070a14" stroke="#1e293b"/>
    <rect x="0" y="0" width="540" height="26" rx="10" fill="#0f172a"/>
    <rect x="0" y="18" width="540" height="8" fill="#0f172a"/>
    <g font-family="ui-monospace, Consolas, monospace" font-size="10">
      <circle cx="14" cy="13" r="3.5" fill="#ef4444"/>
      <circle cx="26" cy="13" r="3.5" fill="#fbbf24"/>
      <circle cx="38" cy="13" r="3.5" fill="#22d3ee"/>
      <text x="56" y="17" fill="#64748b">localhost:3000/dashboard</text>
      <rect x="450" y="5" width="80" height="16" rx="8" fill="#0a1f1a" stroke="#34d399" stroke-opacity="0.55"/>
      <circle cx="465" cy="13" r="3" fill="#34d399"/>
      <text x="500" y="16" fill="#34d399" text-anchor="middle">23 ms</text>
    </g>

    <!-- LEFT chart panel -->
    <g transform="translate(20, 40)">
      <rect width="320" height="180" rx="6" fill="#0a0e1f" stroke="#1c2547"/>
      <text x="12" y="18" font-family="ui-monospace, Consolas, monospace" font-size="9" fill="#22d3ee" letter-spacing="1.5">PRICE · QF/USD</text>
      <!-- filled area -->
      <path d="M 12 130 L 40 110 L 70 122 L 100 95 L 130 100 L 160 80 L 190 88 L 220 70 L 250 75 L 280 60 L 310 55 L 310 165 L 12 165 Z"
            fill="url(#fill-cyan)"/>
      <!-- main line -->
      <path d="M 12 130 L 40 110 L 70 122 L 100 95 L 130 100 L 160 80 L 190 88 L 220 70 L 250 75 L 280 60 L 310 55"
            fill="none" stroke="url(#line-cyan)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- ema dashed -->
      <path d="M 12 138 L 70 130 L 130 115 L 190 100 L 250 88 L 310 75"
            fill="none" stroke="#a78bfa" stroke-opacity="0.55" stroke-width="1.4" stroke-dasharray="3 5"/>
      <!-- end marker -->
      <circle cx="310" cy="55" r="3.5" fill="#22d3ee"/>
    </g>

    <!-- RIGHT metrics tiles -->
    <g transform="translate(360, 40)" font-family="ui-monospace, Consolas, monospace">
      <!-- Tile 1 -->
      <g>
        <rect width="76" height="42" rx="6" fill="#0a0e1f" stroke="#1c2547"/>
        <text x="6" y="14" font-size="8" fill="#64748b" letter-spacing="1.5">PX</text>
        <text x="6" y="33" font-size="14" fill="#22d3ee" font-weight="700">102.34</text>
      </g>
      <g transform="translate(82, 0)">
        <rect width="76" height="42" rx="6" fill="#0a0e1f" stroke="#1c2547"/>
        <text x="6" y="14" font-size="8" fill="#64748b" letter-spacing="1.5">CHG</text>
        <text x="6" y="33" font-size="14" fill="#34d399" font-weight="700">+1.84%</text>
      </g>
      <g transform="translate(0, 50)">
        <rect width="76" height="42" rx="6" fill="#0a0e1f" stroke="#1c2547"/>
        <text x="6" y="14" font-size="8" fill="#64748b" letter-spacing="1.5">RVOL</text>
        <text x="6" y="33" font-size="14" fill="#a78bfa" font-weight="700">12.3%</text>
      </g>
      <g transform="translate(82, 50)">
        <rect width="76" height="42" rx="6" fill="#0a0e1f" stroke="#1c2547"/>
        <text x="6" y="14" font-size="8" fill="#64748b" letter-spacing="1.5">MAX-DD</text>
        <text x="6" y="33" font-size="14" fill="#f0abfc" font-weight="700">-3.1%</text>
      </g>
      <!-- Regime tile -->
      <g transform="translate(0, 100)">
        <rect width="158" height="42" rx="6" fill="#0a0e1f" stroke="#1c2547"/>
        <text x="6" y="14" font-size="8" fill="#64748b" letter-spacing="1.5">REGIME</text>
        <circle cx="86" cy="29" r="4" fill="#22d3ee">
          <animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/>
        </circle>
        <text x="98" y="33" font-size="12" fill="#22d3ee" font-weight="700">CALM</text>
      </g>
      <!-- Sparkline -->
      <g transform="translate(0, 150)">
        <text x="6" y="10" font-size="8" fill="#64748b" letter-spacing="1.5">RSI</text>
        <path d="M 28 24 L 50 22 L 72 26 L 94 18 L 116 20 L 138 14 L 158 12"
              fill="none" stroke="#a78bfa" stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="158" cy="12" r="2.2" fill="#a78bfa"/>
      </g>
    </g>
  </g>

  <rect x="0" y="318" width="1280" height="2" fill="#22d3ee" opacity="0.5"/>
</svg>
